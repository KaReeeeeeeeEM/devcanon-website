[package]
name = "devcanon-studio"
version = "1.1.5"
description = "Visual preset builder and standards studio for devcanon"
authors = ["Kareem"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
include_dir = "0.7"
tauri = { version = "2", features = [] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
