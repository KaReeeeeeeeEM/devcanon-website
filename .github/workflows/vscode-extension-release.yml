name: VS Code extension release

on:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - run: npm run package
      - name: Publish to Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npm run publish:vs
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npm run publish:ovsx
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" devcanon-studio.vsix \
            --title "Devcanon Studio VS Code Extension ${GITHUB_REF_NAME#vscode-v}" \
            --notes-file CHANGELOG.md
