name: Desktop release

on:
  push:
    tags: ["studio-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: studio-v__VERSION__
          releaseName: Devcanon Studio v__VERSION__
          releaseBody: |
            Devcanon Studio 1.1.3 makes new-project setup truly automatic.

            - Bundles the complete Devcanon handbook inside Studio.
            - Initializes the selected new-project folder without requiring a global CLI or network connection.
            - Preserves existing files while adding missing standards and the root AGENTS.md discovery file.
            - Keeps Open existing project validation-only for repositories that already use Devcanon.
            - Includes signed installers and in-app update artifacts for macOS, Windows, and Linux.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
