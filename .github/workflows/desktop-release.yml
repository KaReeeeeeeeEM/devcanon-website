name: Desktop release

on:
  push:
    tags: ["studio-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: studio-v__VERSION__
          releaseName: Devcanon Studio v__VERSION__
          releaseBody: |
            Devcanon Studio 1.2.0 adds simple, guided product setup across desktop and web.

            - Describe what the product should do in plain language.
            - Choose a web, mobile, API, desktop, or general product flow.
            - Select a stack yourself or let the AI choose a simple suitable stack.
            - Creates a readable product brief and complete end-to-end AI build prompt.
            - Supports the same portable product configuration as Devcanon CLI 2.2.0 and the PWA.
            - Includes signed installers and in-app update artifacts for macOS, Windows, and Linux.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
